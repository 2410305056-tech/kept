<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Kept — A private, single-user training ledger and habit tracker." />
    <meta name="theme-color" content="#08080A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kept" />
    
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    
    <title>Kept</title>
    <script>
      (function () {
        var h = location.hash || "";
        if (
          h.indexOf("access_token=") !== -1 ||
          h.indexOf("refresh_token=") !== -1 ||
          h.indexOf("token_hash=") !== -1
        ) {
          try { sessionStorage.setItem("kept.auth.hash", h); } catch (e) {}
          history.replaceState({}, "", location.pathname + location.search + "#/");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
